name: Compila APK Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installa SDK Android richiesto
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: GymHub-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
